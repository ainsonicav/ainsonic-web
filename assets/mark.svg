<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="AINSONIC Sonic Iris Symbol">
  <defs>
    <linearGradient id="sonicGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#3CC8C7"/>
      <stop offset="100%" stop-color="#0E9A9A"/>
    </linearGradient>
    <linearGradient id="lensRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A365D"/>
      <stop offset="100%" stop-color="#08121E"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background base disc (for dark context) -->
  <circle cx="120" cy="120" r="112" fill="#060E18" stroke="#1D3453" stroke-width="2"/>

  <!-- Outer Precision Aperture Ring (Vision / CCTV / Speaker Rim) -->
  <circle cx="120" cy="120" r="96" fill="none" stroke="url(#lensRing)" stroke-width="8"/>
  <circle cx="120" cy="120" r="88" fill="none" stroke="#23426A" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- Secondary Focus Ring -->
  <circle cx="120" cy="120" r="74" fill="none" stroke="url(#sonicGlow)" stroke-width="3" opacity="0.6"/>

  <!-- Precision Optical Tick Marks -->
  <line x1="120" y1="16" x2="120" y2="28" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="212" x2="120" y2="224" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>
  <line x1="16" y1="120" x2="28" y2="120" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>
  <line x1="212" y1="120" x2="224" y2="120" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>

  <!-- Center Pure Acoustic Sine Wave (Sonic Resonance) -->
  <!-- Clean mathematical harmonic sine wave with smooth tapered caps -->
  <path d="M 52 120 C 72 65, 92 65, 120 120 C 148 175, 168 175, 188 120" 
        fill="none" 
        stroke="url(#sonicGlow)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#subtleGlow)"/>

  <!-- Core Acoustic Phase Nodes -->
  <circle cx="52" cy="120" r="4.5" fill="#00E5FF"/>
  <circle cx="120" cy="120" r="5.5" fill="#FFFFFF"/>
  <circle cx="188" cy="120" r="4.5" fill="#00E5FF"/>
</svg>
